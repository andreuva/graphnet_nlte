# Environment for graphnet_nlte (training, database generation, evaluation, plotting).
#
#     conda env create -f environment.yml
#     conda activate gph
#
# Everything resolves from conda-forge plus two PyPI wheels. Nothing is pinned to a build
# string, to a CUDA wheel index, or to a locally-built package, so this installs on any
# x86-64 Linux machine.
#
# NOTE ON LIGHTWEAVER
# -------------------
# The custom 16-level Si I/II/III model atom (`Si_atom_custom`) used to live as a local
# patch to `lightweaver/rh_atoms.py`, which is why this file previously pinned an
# unpublishable `0.16.2.dev1+gdcb4d2664.d20260720`. That atom now ships with the repo as
# si_atom.py, so a stock `lightweaver` from PyPI is all that is needed:
#
#     from si_atom import Si_atom_custom      # NOT from lightweaver.rh_atoms
#
# GPU / CPU
# ---------
# The default below is a CUDA build of PyTorch. conda-forge ships its own CUDA runtime, so
# only the NVIDIA driver matters -- no system CUDA toolkit is required. Developed against
# driver 550.90.07 (H100). For a machine with no GPU, swap the `pytorch-gpu` line for:
#
#     - pytorch=2.7.*=cpu*
#
# and drop the `cuda-version` line.
name: gph
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # --- PyTorch + graph stack ---------------------------------------------------------
  # torch_cluster is deliberately absent: nothing in this repo imports it (the old file
  # listed it, but graphnet.py only needs scatter_mean from torch_scatter).
  - pytorch-gpu=2.7.*
  - cuda-version=12.6          # 12.6 runtime works on any >=12.x driver; raise to 12.9 if
                               # your driver is newer, or drop it for the CPU build
  - pytorch_geometric=2.6.*
  - torch-scatter
  - networkx                   # torch_geometric.utils.to_networkx

  # --- numerics / IO -----------------------------------------------------------------
  - numpy=2.2.*
  - scipy=1.16.*
  - scikit-learn
  - astropy
  - configobj                  # conf.dat hyperparameters; also unpickled from checkpoints,
                               # so it is needed even when only loading a trained model
  - tqdm
  - matplotlib                 # full build (not matplotlib-base): the plot_scripts/ and
                               # explore_tests.py entry points call pl.show()

  # --- MPI, for generate_database.py -------------------------------------------------
  # On an HPC system with a vendor MPI you may prefer to drop these two and build mpi4py
  # against the site MPI instead (`pip install --no-binary=mpi4py mpi4py`).
  #
  # If mpirun aborts with "BTL OFI will now abort", libfabric has picked a provider this
  # node cannot use. Disable that transport:  mpirun --mca btl ^ofi -n <N> ...
  # (this affects the previous conda environment on this machine too -- it is a property
  # of the node's fabric, not of this file).
  - mpi4py
  - openmpi

  # --- lightweaver's own dependencies, via conda so they share the conda numpy ABI ----
  - numba=0.61.*
  - specutils
  - pyyaml
  - parse

  - pip:
      # 0.16.3 is the first release containing commit dcb4d26, which is what the
      # development machine ran as an editable checkout. Prebuilt cp312 manylinux
      # wheel -- no compiler needed.
      - lightweaver==0.16.3
      - weno4
      # Optional: enables the extra GPU utilisation reporting in Formal.py, which is
      # already guarded by try/except and simply stays off if this is absent.
      # - nvidia-ml-py3
